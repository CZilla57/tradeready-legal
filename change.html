<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Order — TradeReady</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           font-size: 16px; line-height: 1.6; color: #1a1a1a; background: #f9f9f9; padding: 2rem 1rem; }
    .page { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px;
            padding: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .brand { font-size: 1.4rem; font-weight: 800; color: #2563eb; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: .25rem; }
    .muted { color: #6b7280; font-size: .9rem; }
    .row { display: flex; justify-content: space-between; padding: .5rem 0; border-bottom: 1px solid #f0f0f0; }
    .total { font-weight: 700; font-size: 1.1rem; border-top: 2px solid #e5e7eb; margin-top: .5rem; padding-top: .75rem; }
    .context { margin-top: 1rem; }
    .context > div { display: flex; justify-content: space-between; padding: .4rem 0; border-bottom: 1px solid #f0f0f0; }
    .context .change-line { font-weight: 600; }
    .context .new-total { font-weight: 700; font-size: 1.1rem; border-top: 2px solid #e5e7eb; border-bottom: none; margin-top: .25rem; padding-top: .75rem; }
    .actions { margin-top: 1.5rem; display: flex; flex-direction: column; gap: .75rem; }
    label { font-size: .9rem; font-weight: 600; display: block; margin-bottom: .35rem; }
    input, textarea { width: 100%; padding: .7rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
    button { padding: .85rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .approve { background: #16a34a; color: #fff; }
    .decline { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
    .hidden { display: none; }
    .banner { padding: 1rem; border-radius: 8px; text-align: center; font-weight: 600; }
    .ok { background: #ecfdf5; color: #065f46; }
    .info { background: #eff6ff; color: #1e40af; }
    .err { background: #fef2f2; color: #991b1b; }
    .footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; font-size: .8rem; color: #9ca3af; }
  </style>
</head>
<body>
<div class="page">
  <div class="brand">TradeReady</div>
  <div id="content"><p class="muted">Review and approve this change to your job.</p></div>
  <div class="footer">By typing your name you approve this change to the original estimate.</div>
</div>

<script>
  var API = 'https://backend-tradeready1.vercel.app/api/estimate';
  var params = new URLSearchParams(location.search);
  var jobId = params.get('j');
  var coId = params.get('co');
  var token = params.get('t');
  var content = document.getElementById('content');

  // Mirrors the app's formatQuote (utils/format.ts). min:0/max:2 alone
  // renders "$87.5" — the exact bug the app fixed in July 2026; round to
  // cents first, then show a FULL cent pair or none. Negative amounts
  // (descope credits) render with the minus sign before the $ sign.
  function money(n) {
    var num = Number(n) || 0;
    var neg = num < 0;
    var cents = Math.round(Math.abs(num) * 100) / 100;
    var hasCents = cents % 1 !== 0;
    return (neg ? '-' : '') + '$' + cents.toLocaleString(undefined, { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function banner(cls, msg) { content.innerHTML = '<div class="banner ' + cls + '">' + esc(msg) + '</div>'; }

  if (!jobId || !coId || !token) { banner('err', 'This link is missing information. Please ask for a new link.'); }
  else { load(); }

  async function load() {
    try {
      var res = await fetch(API + '/change-view?j=' + encodeURIComponent(jobId) + '&co=' + encodeURIComponent(coId) + '&t=' + encodeURIComponent(token));
      if (!res.ok) { banner('err', 'This link is invalid or has expired.'); return; }
      render(await res.json());
    } catch (e) { banner('err', 'Could not load this change order. Please check your connection.'); }
  }

  function render(est) {
    if (est.decision === 'approved') {
      banner('ok', 'You approved this change' + (est.consentAt ? ' on ' + new Date(est.consentAt).toLocaleDateString() : '') + '. Thank you!');
      return;
    }
    if (est.decision === 'declined') {
      banner('info', 'You declined this change. If anything changes, your tradesperson will send a new request.');
      return;
    }
    var lines = (est.lineItems || []).map(function (li) {
      return '<div class="row"><span>' + esc(li.label) + '</span><span>' + money(li.amount) + '</span></div>';
    }).join('');
    var descriptionHtml = est.description
      ? '<p class="muted" style="margin-top:.5rem">' + esc(est.description) + '</p>' : '';
    content.innerHTML =
      '<h1>' + esc(est.jobTitle) + '</h1>' +
      '<p class="muted">From ' + esc(est.businessName) + ' &middot; For ' + esc(est.customerName) + '</p>' +
      '<div style="margin-top:1rem">' + lines +
      descriptionHtml +
      '<div class="row total"><span>Total for this change</span><span>' + money(est.total) + '</span></div></div>' +
      (est.context ?
        '<div class="context">' +
        '<div><span>Job total before this change</span><span id="ctx-original"></span></div>' +
        '<div class="change-line"><span>This change</span><span id="ctx-change"></span></div>' +
        '<div class="new-total"><span>New job total</span><span id="ctx-new"></span></div>' +
        '</div>' : '') +
      '<div class="actions">' +
      '<label for="signer">Type your full name to approve</label>' +
      '<input id="signer" placeholder="Your full name" autocomplete="name">' +
      '<button class="approve" id="approveBtn">Approve this change</button>' +
      '<button class="decline" id="declineBtn">Decline</button>' +
      '</div>';
    if (est.context) {
      document.getElementById('ctx-original').textContent = money(est.context.originalTotal);
      var sign = est.context.changeAmount >= 0 ? '+' : '';
      document.getElementById('ctx-change').textContent = sign + money(est.context.changeAmount);
      document.getElementById('ctx-new').textContent = money(est.context.newTotal);
    }
    document.getElementById('approveBtn').onclick = function () { respond('approved'); };
    document.getElementById('declineBtn').onclick = function () { respond('declined'); };
  }

  async function respond(decision) {
    var signerName = (document.getElementById('signer') || {}).value || '';
    if (decision === 'approved' && !signerName.trim()) { alert('Please type your name to approve.'); return; }
    var reason = decision === 'declined' ? (prompt('Optional: reason for declining?') || '') : '';
    banner('info', 'Submitting…');
    try {
      var res = await fetch(API + '/change-respond', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobId: jobId, changeOrderId: coId, token: token, decision: decision, signerName: signerName, declineReason: reason }),
      });
      var out = await res.json();
      if (!res.ok) { banner('err', out.error || 'Something went wrong. Please try again.'); return; }
      banner(decision === 'approved' ? 'ok' : 'info',
        decision === 'approved' ? 'Approved — thank you! Your tradesperson has been notified.' : 'You declined this change. Thank you for letting us know.');
    } catch (e) { banner('err', 'Could not submit. Please check your connection and try again.'); }
  }
</script>
</body>
</html>
