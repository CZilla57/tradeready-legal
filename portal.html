<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c335e">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Your customer portal — TradeReady</title>
  <style>
    @font-face { font-family: 'Chakra Petch'; src: url('/fonts/ChakraPetch-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Public Sans'; src: url('/fonts/PublicSans-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Public Sans'; src: url('/fonts/PublicSans-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Public Sans'; src: url('/fonts/PublicSans-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('/fonts/IBMPlexMono-Medium.ttf') format('truetype'); font-weight: 500; font-display: swap; }

    :root {
      --navy: #0c335e;
      --navy-2: #092747;
      --accent: #1d5c9e;
      --accent-strong: #174b80;
      --accent-soft: #e8f1f8;
      --orange: #e58a2b;
      --bg: #f4f3ee;
      --surface: #ffffff;
      --surface-soft: #f8f9fa;
      --ink: #14213d;
      --muted: #626b79;
      --line: #d9dee5;
      --success: #176b4d;
      --success-soft: #e8f5ef;
      --warning: #8a5308;
      --warning-soft: #fff4d8;
      --danger: #9f2f32;
      --danger-soft: #fae9e9;
      --display: 'Chakra Petch', 'Segoe UI', sans-serif;
      --body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 1rem; }
    body { margin: 0; min-width: 320px; font-family: var(--body); font-size: 16px; line-height: 1.55; color: var(--ink); background: var(--bg); }
    button, select, textarea { font: inherit; }
    button, a, select { touch-action: manipulation; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid #ed9f4e; outline-offset: 3px; border-radius: 5px; }
    .skip-link { position: fixed; top: -100px; left: 1rem; z-index: 20; padding: .75rem 1rem; border-radius: 8px; background: var(--surface); color: var(--navy); font-weight: 700; }
    .skip-link:focus { top: 1rem; }

    .site-head { color: #f4f7fb; background-color: var(--navy); background-image: linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px); background-size: 24px 24px; }
    .head-inner { width: min(1080px, calc(100% - 2rem)); margin: 0 auto; }
    .topbar { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-bottom: 1px solid rgba(255,255,255,.14); }
    .brand { font-family: var(--display); font-size: 1.35rem; font-weight: 700; letter-spacing: .02em; }
    .brand span { color: #f0a04b; }
    .portal-label { display: inline-flex; align-items: center; gap: .45rem; font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: #c9d6e6; }
    .portal-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #70cf9f; box-shadow: 0 0 0 4px rgba(112,207,159,.12); }
    .hero { padding: 2.5rem 0 3rem; }
    .eyebrow { margin: 0 0 .65rem; font-family: var(--mono); font-size: .76rem; line-height: 1.4; letter-spacing: .15em; text-transform: uppercase; color: #aebfd3; }
    .hero h1 { max-width: 800px; margin: 0; font-family: var(--display); font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.08; text-wrap: balance; overflow-wrap: anywhere; }
    .welcome { margin: .8rem 0 0; color: #c9d6e6; font-size: 1.02rem; }

    .page { width: min(1080px, calc(100% - 2rem)); margin: -1rem auto 0; padding-bottom: 3rem; position: relative; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 1.5rem; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: 0 12px 34px rgba(20,33,61,.09); }
    .summary-item { min-width: 0; padding: 1rem 1.15rem; }
    .summary-item + .summary-item { border-left: 1px solid var(--line); }
    .summary-label { display: block; margin-bottom: .15rem; color: var(--muted); font-size: .76rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .summary-value { display: block; font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(290px, .75fr); gap: 1.5rem; align-items: start; }
    .main-column, .side-column { min-width: 0; }
    .side-column { position: sticky; top: 1rem; }
    .section { margin-bottom: 1.75rem; scroll-margin-top: 1rem; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin: 0 0 .7rem; }
    .section h2 { margin: 0; font-family: var(--display); font-size: 1.3rem; line-height: 1.2; text-wrap: balance; }
    .section-count { color: var(--muted); font-family: var(--mono); font-size: .75rem; white-space: nowrap; }

    .card { margin-bottom: .7rem; padding: 1rem 1.05rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 2px 8px rgba(20,33,61,.035); }
    .card:last-child { margin-bottom: 0; }
    .card-row { display: flex; justify-content: space-between; align-items: flex-start; gap: .9rem; }
    .card-copy { min-width: 0; }
    .card-kicker { margin: 0 0 .18rem; color: var(--muted); font-family: var(--mono); font-size: .69rem; letter-spacing: .08em; text-transform: uppercase; }
    .card-title { display: block; font-size: 1rem; line-height: 1.35; overflow-wrap: anywhere; }
    .card-meta { margin: .28rem 0 0; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .amount-primary { color: var(--ink); font-weight: 700; }
    .chip { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 26px; padding: .2rem .58rem; border-radius: 999px; font-size: .72rem; font-weight: 700; line-height: 1.2; white-space: nowrap; }
    .chip::before { content: ''; width: 6px; height: 6px; margin-right: .38rem; border-radius: 50%; background: currentColor; opacity: .75; }
    .chip-ok { background: var(--success-soft); color: var(--success); }
    .chip-info { background: var(--accent-soft); color: var(--accent-strong); }
    .chip-warn { background: var(--warning-soft); color: var(--warning); }
    .chip-err { background: var(--danger-soft); color: var(--danger); }
    .card-actions { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: .85rem; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: .58rem .9rem; border: 1px solid var(--accent); border-radius: 8px; color: #fff; background: var(--accent); font-size: .88rem; font-weight: 700; line-height: 1.2; text-decoration: none; cursor: pointer; transition: background-color .16s ease, border-color .16s ease, transform .16s ease; }
    .button:hover { border-color: var(--accent-strong); background: var(--accent-strong); }
    .button:active { transform: translateY(1px); }
    .button-secondary { color: var(--accent-strong); background: var(--surface); }
    .button-secondary:hover { color: var(--navy); background: var(--accent-soft); }
    .button-wide { width: 100%; }
    .empty { padding: 1.1rem; border: 1px dashed #c9d0d9; border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.48); font-size: .92rem; }

    .photo-group + .photo-group { margin-top: 1rem; }
    .photo-label { margin: 0 0 .5rem; color: var(--muted); font-size: .83rem; font-weight: 700; overflow-wrap: anywhere; }
    .thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .65rem; }
    .thumbs a { display: block; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #e5e8eb; transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease; }
    .thumbs a:hover { border-color: var(--accent); box-shadow: 0 7px 20px rgba(20,33,61,.13); transform: translateY(-1px); }
    .thumbs img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .request-panel { padding: 1.2rem; border: 1px solid #c6d5e4; border-radius: 14px; background: var(--surface); box-shadow: 0 8px 24px rgba(20,33,61,.07); }
    .request-panel h2 { margin: 0; font-family: var(--display); font-size: 1.25rem; }
    .request-intro { margin: .4rem 0 1rem; color: var(--muted); font-size: .9rem; }
    .field { margin-bottom: .85rem; }
    .field-label { display: block; margin-bottom: .35rem; font-size: .82rem; font-weight: 700; }
    .reqbox select, .reqbox textarea { display: block; width: 100%; border: 1px solid #b9c2ce; border-radius: 8px; color: var(--ink); background: var(--surface); }
    .reqbox select { min-height: 44px; padding: .6rem 2.2rem .6rem .7rem; }
    .reqbox textarea { min-height: 112px; padding: .65rem .7rem; resize: vertical; }
    .reqbox select:hover, .reqbox textarea:hover { border-color: #8493a5; }
    .reqbox select:focus-visible, .reqbox textarea:focus-visible { border-color: var(--accent); }
    .field-help { display: flex; justify-content: space-between; gap: .75rem; margin-top: .3rem; color: var(--muted); font-size: .73rem; }
    .character-count { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .reqbox button:disabled { cursor: wait; opacity: .65; }
    .reqnote { min-height: 1.35rem; margin-top: .65rem; font-size: .84rem; font-weight: 700; }
    .reqnote.bad { color: var(--danger); }
    .reqnote.good { color: var(--success); }
    .privacy-note { display: flex; gap: .65rem; margin: 1rem 0 0; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .76rem; }
    .privacy-mark { flex: 0 0 auto; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: var(--accent-strong); background: var(--accent-soft); font-weight: 700; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

    .banner { max-width: 600px; margin: 2rem auto; padding: 1.25rem; border: 1px solid transparent; border-radius: 12px; background: var(--surface); text-align: center; }
    .banner h1 { margin: 0 0 .35rem; font-family: var(--display); font-size: 1.35rem; }
    .banner p { margin: 0; color: var(--muted); }
    .banner.err { border-color: #e7bcbc; }
    .banner .button { margin-top: 1rem; }
    .loading { max-width: none; min-height: 230px; display: grid; place-items: center; margin: 0; }
    .loading-mark { width: 34px; height: 34px; margin: 0 auto .85rem; border: 3px solid #d7e1ea; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { width: min(1080px, calc(100% - 2rem)); margin: 0 auto; padding: 1.4rem 0 2.25rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; text-align: center; }

    @media (max-width: 760px) {
      .hero { padding: 2rem 0 2.35rem; }
      .layout { grid-template-columns: 1fr; }
      .side-column { position: static; }
      .summary { grid-template-columns: 1fr; }
      .summary-item + .summary-item { border-top: 1px solid var(--line); border-left: 0; }
      .thumbs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 460px) {
      .head-inner, .page, .footer { width: min(100% - 1.25rem, 1080px); }
      .topbar { min-height: 60px; }
      .portal-label { font-size: .64rem; }
      .hero h1 { font-size: 1.85rem; }
      .card-row { display: block; }
      .chip { margin-top: .65rem; }
      .card-actions .button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .loading-mark { animation: none; }
      .button, .thumbs a { transition: none; }
    }
  </style>
</head>
<body>
<a class="skip-link" href="#content">Skip to portal content</a>
<header class="site-head">
  <div class="head-inner">
    <div class="topbar">
      <div class="brand" translate="no">TradeReady<span>.</span></div>
      <div class="portal-label">Private-link portal</div>
    </div>
    <div class="hero" id="hero">
      <p class="eyebrow">Customer portal</p>
      <h1 id="businessName">Your project, all in one place.</h1>
      <p class="welcome" id="customerName">View updates, approve work, and take care of invoices.</p>
    </div>
  </div>
</header>
<main class="page" id="content" aria-busy="true">
  <div class="banner loading" role="status">
    <div><div class="loading-mark" aria-hidden="true"></div><p>Loading your portal…</p></div>
  </div>
</main>
<footer class="footer">Powered by <span translate="no">TradeReady</span>. Anyone with this private link can view the information on this page.</footer>

<script>
  var API = 'https://tradeready-backend.tradeready.workers.dev/api/estimate';
  var params = new URLSearchParams(location.search);
  var token = params.get('p');
  var content = document.getElementById('content');
  var businessName = document.getElementById('businessName');
  var customerName = document.getElementById('customerName');
  // Idempotency key for the request form: one per page load, replaced after
  // each successful send — a network retry of the SAME send lands on the
  // same server row, a second request gets a fresh one.
  var requestKey = mintRequestKey();

  function mintRequestKey() {
    var bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  // Mirrors the app's two formatters (utils/format.ts). min:0/max:2 alone
  // renders "$87.5" — the exact bug the app fixed in July 2026; round to
  // cents first, then show a FULL cent pair or none.
  function money(n) {
    var cents = Math.round((Number(n) || 0) * 100) / 100;
    var hasCents = cents % 1 !== 0;
    return cents.toLocaleString(undefined, { style: 'currency', currency: 'USD', minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
  }
  // Invoice amounts always show cents, like the app's formatMoney.
  function invoiceMoney(n) {
    var cents = Math.round((Number(n) || 0) * 100) / 100;
    return cents.toLocaleString(undefined, { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  // Owner-naive YYYY-MM-DD rendered through UTC getters so the viewer's zone
  // can never shift the business day (booking.html precedent).
  function fmtDate(ymd) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ymd))) return esc(ymd);
    var d = new Date(ymd + 'T00:00:00Z');
    return new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }).format(d);
  }
  function fmtTime(hm) {
    if (!/^\d{2}:\d{2}$/.test(String(hm))) return esc(hm);
    var parts = hm.split(':');
    var d = new Date(Date.UTC(2000, 0, 1, Number(parts[0]), Number(parts[1])));
    return new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', timeZone: 'UTC' }).format(d);
  }
  function banner(title, msg, canRetry) {
    content.setAttribute('aria-busy', 'false');
    content.innerHTML = '<div class="banner err"><h1>' + esc(title) + '</h1><p>' + esc(msg) + '</p>' +
      (canRetry ? '<button class="button" id="retryLoad" type="button">Try Again</button>' : '') + '</div>';
    if (canRetry) document.getElementById('retryLoad').addEventListener('click', load);
  }

  if (!token) { banner('This link is incomplete', 'Ask the business to send you a new customer portal link.', false); }
  else { load(); }

  async function load() {
    content.setAttribute('aria-busy', 'true');
    content.innerHTML = '<div class="banner loading" role="status"><div><div class="loading-mark" aria-hidden="true"></div><p>Loading your portal…</p></div></div>';
    try {
      var res = await fetch(API + '/portal-view?p=' + encodeURIComponent(token));
      if (!res.ok) { banner('This link is no longer available', 'Ask the business to send you a new customer portal link.', false); return; }
      render(await res.json());
    } catch (e) { banner('We couldn’t load your portal', 'Check your connection, then try again.', true); }
  }

  function appointmentCard(a) {
    var when = fmtDate(a.date) + (a.start ? ' · ' + fmtTime(a.start) + (a.end ? '–' + fmtTime(a.end) : '') : '');
    var links = '<a class="button button-secondary" href="' + esc(a.icsUrl) + '">Add to Calendar</a>';
    if (a.manageUrl) links += '<a class="button" href="' + esc(a.manageUrl) + '">Confirm or Change</a>';
    else links += '<a class="button button-secondary request-change" href="#request" data-job-ref="' + esc(a.jobRef) + '">Request a Change</a>';
    return '<article class="card"><div class="card-row"><div class="card-copy"><p class="card-kicker">Appointment</p><strong class="card-title">' + esc(a.title || 'Appointment') + '</strong>' +
           '<p class="card-meta">' + when + '</p></div>' +
           '<span class="chip chip-info">Scheduled</span></div>' +
           '<div class="card-actions">' + links + '</div></article>';
  }

  function estimateCard(e) {
    var status, action = '';
    if (e.decision === 'approved') status = '<span class="chip chip-ok">Approved</span>';
    else if (e.decision === 'declined') status = '<span class="chip chip-err">Declined</span>';
    else {
      status = '<span class="chip chip-warn">Needs review</span>';
      action = '<div class="card-actions"><a class="button" href="' + esc(e.approvalUrl) + '">Review Estimate</a></div>';
    }
    return '<article class="card"><div class="card-row"><div class="card-copy"><p class="card-kicker">Estimate</p><strong class="card-title">' + esc(e.title || 'Estimate') + '</strong>' +
           '<p class="card-meta amount-primary">' + money(e.total) + '</p></div>' + status + '</div>' + action + '</article>';
  }

  function changeCard(c) {
    var status, action = '';
    if (c.status === 'approved') status = '<span class="chip chip-ok">Approved</span>';
    else if (c.status === 'declined') status = '<span class="chip chip-err">Declined</span>';
    else {
      status = '<span class="chip chip-warn">Needs review</span>';
      action = '<div class="card-actions"><a class="button" href="' + esc(c.changeUrl) + '">Review Change</a></div>';
    }
    var amt = (c.amount < 0 ? '−' : '+') + money(Math.abs(Number(c.amount) || 0));
    return '<article class="card"><div class="card-row"><div class="card-copy"><p class="card-kicker">Change to ' + esc(c.jobTitle || 'project') + '</p><strong class="card-title">' + esc(c.title || 'Change') + '</strong>' +
           '<p class="card-meta amount-primary">' + amt + '</p></div>' + status + '</div>' + action + '</article>';
  }

  function invoiceCard(i) {
    var right, amount, action = '';
    if (i.paid) {
      right = '<span class="chip chip-ok">Paid</span>';
      amount = invoiceMoney(i.amount);
    } else {
      right = '<span class="chip chip-warn">Payment due</span>';
      if (i.paymentLinkUrl) action = '<div class="card-actions"><a class="button" href="' + esc(i.paymentLinkUrl) + '">Pay ' + invoiceMoney(i.balanceDue) + '</a></div>';
      amount = i.amountPaid > 0
        ? invoiceMoney(i.amountPaid) + ' paid · ' + invoiceMoney(i.balanceDue) + ' due of ' + invoiceMoney(i.amount)
        : (i.balanceDue < i.amount
            ? invoiceMoney(i.balanceDue) + ' of ' + invoiceMoney(i.amount) + ' outstanding'
            : invoiceMoney(i.amount));
    }
    return '<article class="card"><div class="card-row"><div class="card-copy"><p class="card-kicker">Invoice</p><strong class="card-title">' + esc(i.number || 'Invoice') + '</strong>' +
           '<p class="card-meta"><span class="amount-primary">' + amount + '</span>' + (i.due && !i.paid ? ' · Due ' + fmtDate(i.due) : '') + '</p></div>' + right + '</div>' + action + '</article>';
  }

  function photosSection(photos) {
    // Group by job title; signed URLs expire (~15 min) — a broken image on a
    // stale tab hides itself rather than showing a broken glyph.
    var byJob = {};
    photos.forEach(function (p) {
      var key = p.jobTitle || 'Photos';
      (byJob[key] = byJob[key] || []).push(p);
    });
    return Object.keys(byJob).map(function (jobTitle) {
      var imgs = byJob[jobTitle].map(function (p, index) {
        return '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(jobTitle) + ' photo ' + (index + 1) + ' full size">' +
               '<img loading="lazy" width="144" height="108" src="' + esc(p.url) + '" alt="' + esc(jobTitle) + ' project photo ' + (index + 1) + '" ' +
               'onerror="this.parentNode.style.display=\'none\'"></a>';
      }).join('');
      return '<div class="photo-group"><p class="photo-label">' + esc(jobTitle) + '</p><div class="thumbs">' + imgs + '</div></div>';
    }).join('');
  }

  function requestSection(appointments) {
    var opts = '<option value="followup">Request follow-up work</option>';
    appointments.forEach(function (a) {
      var label = (a.title || 'Appointment') + ' (' + a.date + ')';
      opts += '<option value="reschedule:' + esc(a.jobRef) + '">Reschedule: ' + esc(label) + '</option>';
      opts += '<option value="cancel:' + esc(a.jobRef) + '">Cancel: ' + esc(label) + '</option>';
    });
    return '<div class="request-panel reqbox" id="request"><h2>Need Something Else?</h2>' +
      '<p class="request-intro">Send the business a follow-up or ask to change an appointment.</p>' +
      '<div class="field"><label class="field-label" for="reqKind">What Do You Need?</label>' +
      '<select id="reqKind" name="request-kind" autocomplete="off">' + opts + '</select></div>' +
      '<div class="field"><label class="field-label" for="reqNote">Details</label>' +
      '<textarea id="reqNote" name="request-details" maxlength="300" autocomplete="off" aria-describedby="noteHint reqStatus" placeholder="Add dates, times, or a short description…"></textarea>' +
      '<div class="field-help"><span id="noteHint">Include enough detail for the business to follow up.</span><span class="character-count" id="reqCount">0 / 300</span></div></div>' +
      '<input class="hp" id="reqWebsite" name="website" tabindex="-1" autocomplete="off">' +
      '<button class="button button-wide" id="reqSend" type="button">Send Request</button>' +
      '<div id="reqStatus" class="reqnote" role="status" aria-live="polite"></div>' +
      '<p class="privacy-note"><span class="privacy-mark" aria-hidden="true">i</span><span>Your request goes directly to the business. It does not automatically change your appointment.</span></p></div>';
  }

  async function sendRequest() {
    var kindRaw = document.getElementById('reqKind').value;
    var note = document.getElementById('reqNote').value.trim();
    var statusEl = document.getElementById('reqStatus');
    var btn = document.getElementById('reqSend');
    var parts = kindRaw.split(':');
    var kind = parts[0];
    var jobRef = parts[1] || undefined;

    statusEl.className = 'reqnote';
    if (kind === 'followup' && !note) {
      statusEl.className = 'reqnote bad';
      statusEl.textContent = 'Please describe what you need.';
      document.getElementById('reqNote').setAttribute('aria-invalid', 'true');
      document.getElementById('reqNote').focus();
      return;
    }

    document.getElementById('reqNote').removeAttribute('aria-invalid');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    statusEl.textContent = 'Sending…';
    try {
      var res = await fetch(API + '/portal-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          p: token,
          kind: kind,
          note: note,
          jobRef: jobRef,
          requestKey: requestKey,
          website: document.getElementById('reqWebsite').value
        })
      });
      var out = await res.json().catch(function () { return {}; });
      if (res.ok) {
        statusEl.className = 'reqnote good';
        statusEl.textContent = 'Request sent — we’ll be in touch.';
        document.getElementById('reqNote').value = '';
        document.getElementById('reqCount').textContent = '0 / 300';
        requestKey = mintRequestKey(); // next request is a NEW request
      } else {
        statusEl.className = 'reqnote bad';
        statusEl.textContent = out.error || 'Could not send that. Please try again.';
      }
    } catch (e) {
      statusEl.className = 'reqnote bad';
      statusEl.textContent = 'Could not send that. Please check your connection.';
    }
    btn.disabled = false;
    btn.textContent = 'Send Request';
  }

  function section(id, title, items, emptyText) {
    var count = items.length;
    return '<section class="section" id="' + id + '"><div class="section-head"><h2>' + title + '</h2>' +
      '<span class="section-count">' + count + ' ' + (count === 1 ? 'item' : 'items') + '</span></div>' +
      (count ? items.join('') : '<div class="empty">' + emptyText + '</div>') + '</section>';
  }

  function render(data) {
    var appointments = data.appointments || [];
    var changes = data.changeOrders || [];
    var photos = data.photos || [];
    var estimates = data.estimates || [];
    var invoices = data.invoices || [];
    var needsReview = estimates.filter(function (e) { return !e.decision; }).length + changes.filter(function (c) { return c.status !== 'approved' && c.status !== 'declined'; }).length;
    var balanceDue = invoices.reduce(function (sum, i) { return sum + (i.paid ? 0 : Math.max(0, Number(i.balanceDue) || 0)); }, 0);
    var nextAppointment = appointments.length ? fmtDate(appointments[0].date) : 'None scheduled';

    businessName.textContent = data.businessName || 'Your project, all in one place.';
    customerName.textContent = data.customerName ? 'Welcome, ' + data.customerName + '. Here’s the latest from your project.' : 'View updates, approve work, and take care of invoices.';

    var html = '<div class="summary" aria-label="Portal summary">' +
      '<div class="summary-item"><span class="summary-label">Next appointment</span><span class="summary-value">' + nextAppointment + '</span></div>' +
      '<div class="summary-item"><span class="summary-label">Needs your review</span><span class="summary-value">' + needsReview + (needsReview === 1 ? ' item' : ' items') + '</span></div>' +
      '<div class="summary-item"><span class="summary-label">Total balance due</span><span class="summary-value">' + invoiceMoney(balanceDue) + '</span></div></div>' +
      '<div class="layout"><div class="main-column">' +
      section('appointments', 'Upcoming Appointments', appointments.map(appointmentCard), 'No upcoming appointments are scheduled.') +
      section('estimates', 'Estimates', estimates.map(estimateCard), 'No estimates have been shared yet.') +
      (changes.length ? section('changes', 'Project Changes', changes.map(changeCard), '') : '') +
      section('invoices', 'Invoices', invoices.map(invoiceCard), 'No invoices have been shared yet.') +
      (photos.length ? '<section class="section" id="photos"><div class="section-head"><h2>Project Photos</h2><span class="section-count">' + photos.length + (photos.length === 1 ? ' photo' : ' photos') + '</span></div>' + photosSection(photos) + '</section>' : '') +
      '</div><aside class="side-column" aria-label="Contact the business">' + requestSection(appointments) + '</aside></div>';
    content.innerHTML = html;
    content.setAttribute('aria-busy', 'false');
    document.getElementById('reqSend').addEventListener('click', sendRequest);
    document.getElementById('reqNote').addEventListener('input', function (event) {
      document.getElementById('reqCount').textContent = event.target.value.length + ' / 300';
      if (event.target.value.trim()) event.target.removeAttribute('aria-invalid');
    });
    document.getElementById('reqKind').addEventListener('change', function (event) {
      var followup = event.target.value === 'followup';
      document.getElementById('noteHint').textContent = followup
        ? 'Include enough detail for the business to follow up.'
        : 'Details are optional, but a preferred date or time can help.';
    });
    Array.prototype.forEach.call(document.querySelectorAll('.request-change'), function (link) {
      link.addEventListener('click', function () {
        var select = document.getElementById('reqKind');
        var value = 'reschedule:' + link.getAttribute('data-job-ref');
        var hasOption = Array.prototype.some.call(select.options, function (option) { return option.value === value; });
        if (hasOption) {
          select.value = value;
          select.dispatchEvent(new Event('change'));
        }
      });
    });
  }
</script>
</body>
</html>
