<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Your account — TradeReady</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           font-size: 16px; line-height: 1.6; color: #1a1a1a; background: #f9f9f9; padding: 2rem 1rem; }
    .page { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px;
            padding: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .brand { font-size: 1.4rem; font-weight: 800; color: #2563eb; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: .25rem; }
    h2 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
    .muted { color: #6b7280; font-size: .9rem; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: .85rem; margin-bottom: .6rem; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .chip { font-size: .8rem; font-weight: 700; padding: .15rem .55rem; border-radius: 999px; white-space: nowrap; }
    .chip-ok { background: #ecfdf5; color: #065f46; }
    .chip-info { background: #eff6ff; color: #1e40af; }
    .chip-warn { background: #fffbeb; color: #92400e; }
    .chip-err { background: #fef2f2; color: #991b1b; }
    a.button { display: inline-block; padding: .5rem .9rem; border-radius: 8px; font-weight: 600;
               text-decoration: none; background: #2563eb; color: #fff; font-size: .9rem; }
    .banner { padding: 1rem; border-radius: 8px; text-align: center; font-weight: 600; }
    .err { background: #fef2f2; color: #991b1b; }
    .ok { background: #ecfdf5; color: #065f46; }
    .linkrow { margin-top: .5rem; display: flex; flex-wrap: wrap; gap: .75rem; font-size: .9rem; }
    .linkrow a { color: #2563eb; font-weight: 600; text-decoration: none; }
    .thumbs { display: flex; flex-wrap: wrap; gap: .5rem; margin: .4rem 0 .8rem; }
    .thumbs a { display: block; width: 96px; height: 96px; border-radius: 8px; overflow: hidden;
                border: 1px solid #e5e7eb; background: #f3f4f6; }
    .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .reqbox select, .reqbox textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 8px;
      padding: .55rem .7rem; font: inherit; margin-bottom: .6rem; background: #fff; }
    .reqbox textarea { min-height: 84px; resize: vertical; }
    .reqbox button { border: 0; padding: .55rem 1rem; border-radius: 8px; font-weight: 600;
      background: #2563eb; color: #fff; font-size: .9rem; cursor: pointer; }
    .reqbox button:disabled { opacity: .5; }
    .reqnote { margin-top: .5rem; font-size: .9rem; font-weight: 600; }
    .reqnote.bad { color: #991b1b; }
    .reqnote.good { color: #065f46; }
    /* Honeypot: visually gone, still in the form for bots. */
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; font-size: .8rem; color: #9ca3af; }
  </style>
</head>
<body>
<div class="page">
  <div class="brand">TradeReady</div>
  <div id="content"><p class="muted">Loading your account…</p></div>
  <div class="footer">This private page was shared with you by the business. Anyone with the link can view it.</div>
</div>

<script>
  var API = 'https://tradeready-backend.tradeready.workers.dev/api/estimate';
  var params = new URLSearchParams(location.search);
  var token = params.get('p');
  var content = document.getElementById('content');
  // Idempotency key for the request form: one per page load, replaced after
  // each successful send — a network retry of the SAME send lands on the
  // same server row, a second request gets a fresh one.
  var requestKey = mintRequestKey();

  function mintRequestKey() {
    var bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  // Mirrors the app's two formatters (utils/format.ts). min:0/max:2 alone
  // renders "$87.5" — the exact bug the app fixed in July 2026; round to
  // cents first, then show a FULL cent pair or none.
  function money(n) {
    var cents = Math.round((Number(n) || 0) * 100) / 100;
    var hasCents = cents % 1 !== 0;
    return '$' + cents.toLocaleString(undefined, { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
  }
  // Invoice amounts always show cents, like the app's formatMoney.
  function invoiceMoney(n) {
    var cents = Math.round((Number(n) || 0) * 100) / 100;
    return '$' + cents.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  // Owner-naive YYYY-MM-DD rendered through UTC getters so the viewer's zone
  // can never shift the business day (booking.html precedent).
  function fmtDate(ymd) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ymd))) return esc(ymd);
    var d = new Date(ymd + 'T00:00:00Z');
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return days[d.getUTCDay()] + ', ' + months[d.getUTCMonth()] + ' ' + d.getUTCDate();
  }
  function banner(cls, msg) { content.innerHTML = '<div class="banner ' + cls + '">' + esc(msg) + '</div>'; }

  if (!token) { banner('err', 'This link is missing information. Please ask for a new link.'); }
  else { load(); }

  async function load() {
    try {
      var res = await fetch(API + '/portal-view?p=' + encodeURIComponent(token));
      if (!res.ok) { banner('err', 'This link is invalid.'); return; }
      render(await res.json());
    } catch (e) { banner('err', 'Could not load this page. Please check your connection.'); }
  }

  function appointmentCard(a) {
    var when = fmtDate(a.date) + (a.start ? ' · ' + esc(a.start) + (a.end ? '–' + esc(a.end) : '') : '');
    var links = '<a href="' + esc(a.icsUrl) + '">Add to calendar</a>';
    if (a.manageUrl) links += '<a href="' + esc(a.manageUrl) + '">Confirm or change</a>';
    else links += '<a href="#request">Request a change</a>';
    return '<div class="card"><div class="row"><strong>' + esc(a.title || 'Appointment') + '</strong>' +
           '<span class="chip chip-info">Scheduled</span></div>' +
           '<div class="muted">' + when + '</div>' +
           '<div class="linkrow">' + links + '</div></div>';
  }

  function estimateCard(e) {
    var status, action = '';
    if (e.decision === 'approved') status = '<span class="chip chip-ok">Approved</span>';
    else if (e.decision === 'declined') status = '<span class="chip chip-err">Declined</span>';
    else {
      status = '<span class="chip chip-info">Awaiting your approval</span>';
      action = '<div style="margin-top:.5rem"><a class="button" href="' + esc(e.approvalUrl) + '">Review &amp; approve</a></div>';
    }
    return '<div class="card"><div class="row"><strong>' + esc(e.title) + '</strong>' + status + '</div>' +
           '<div class="muted">' + money(e.total) + '</div>' + action + '</div>';
  }

  function changeCard(c) {
    var status, action = '';
    if (c.status === 'approved') status = '<span class="chip chip-ok">Approved</span>';
    else if (c.status === 'declined') status = '<span class="chip chip-err">Declined</span>';
    else {
      status = '<span class="chip chip-info">Awaiting your approval</span>';
      action = '<div style="margin-top:.5rem"><a class="button" href="' + esc(c.changeUrl) + '">Review &amp; approve</a></div>';
    }
    var amt = (c.amount < 0 ? '−' : '+') + money(Math.abs(Number(c.amount) || 0));
    return '<div class="card"><div class="row"><strong>' + esc(c.title) + '</strong>' + status + '</div>' +
           '<div class="muted">' + amt + ' · ' + esc(c.jobTitle) + '</div>' + action + '</div>';
  }

  function invoiceCard(i) {
    var right, amount;
    if (i.paid) {
      right = '<span class="chip chip-ok">Paid</span>';
      amount = invoiceMoney(i.amount);
    } else {
      right = i.paymentLinkUrl
        ? '<a class="button" href="' + esc(i.paymentLinkUrl) + '">Pay</a>'
        : '<span class="chip chip-warn">Due</span>';
      amount = i.amountPaid > 0
        ? invoiceMoney(i.amountPaid) + ' paid · ' + invoiceMoney(i.balanceDue) + ' due of ' + invoiceMoney(i.amount)
        : (i.balanceDue < i.amount
            ? invoiceMoney(i.balanceDue) + ' of ' + invoiceMoney(i.amount) + ' outstanding'
            : invoiceMoney(i.amount));
    }
    return '<div class="card"><div class="row"><strong>' + esc(i.number) + '</strong>' + right + '</div>' +
           '<div class="muted">' + amount + (i.due && !i.paid ? ' · due ' + esc(i.due) : '') + '</div></div>';
  }

  function photosSection(photos) {
    // Group by job title; signed URLs expire (~15 min) — a broken image on a
    // stale tab hides itself rather than showing a broken glyph.
    var byJob = {};
    photos.forEach(function (p) {
      var key = p.jobTitle || 'Photos';
      (byJob[key] = byJob[key] || []).push(p);
    });
    return Object.keys(byJob).map(function (jobTitle) {
      var imgs = byJob[jobTitle].map(function (p) {
        return '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' +
               '<img loading="lazy" src="' + esc(p.url) + '" alt="Job photo" ' +
               'onerror="this.parentNode.style.display=\'none\'"></a>';
      }).join('');
      return '<div class="muted">' + esc(jobTitle) + '</div><div class="thumbs">' + imgs + '</div>';
    }).join('');
  }

  function requestSection(appointments) {
    var opts = '<option value="followup">Request follow-up work</option>';
    appointments.forEach(function (a) {
      var label = (a.title || 'Appointment') + ' (' + a.date + ')';
      opts += '<option value="reschedule:' + esc(a.jobRef) + '">Reschedule: ' + esc(label) + '</option>';
      opts += '<option value="cancel:' + esc(a.jobRef) + '">Cancel: ' + esc(label) + '</option>';
    });
    return '<h2 id="request">Need something else?</h2>' +
      '<div class="card reqbox">' +
      '<select id="reqKind">' + opts + '</select>' +
      '<textarea id="reqNote" maxlength="300" placeholder="Tell us what you need…"></textarea>' +
      '<input class="hp" id="reqWebsite" name="website" tabindex="-1" autocomplete="off">' +
      '<button id="reqSend" type="button">Send request</button>' +
      '<div id="reqStatus" class="reqnote" role="status"></div>' +
      '</div>';
  }

  async function sendRequest() {
    var kindRaw = document.getElementById('reqKind').value;
    var note = document.getElementById('reqNote').value.trim();
    var statusEl = document.getElementById('reqStatus');
    var btn = document.getElementById('reqSend');
    var parts = kindRaw.split(':');
    var kind = parts[0];
    var jobRef = parts[1] || undefined;

    statusEl.className = 'reqnote';
    if (kind === 'followup' && !note) {
      statusEl.className = 'reqnote bad';
      statusEl.textContent = 'Please describe what you need.';
      return;
    }

    btn.disabled = true;
    statusEl.textContent = 'Sending…';
    try {
      var res = await fetch(API + '/portal-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          p: token,
          kind: kind,
          note: note,
          jobRef: jobRef,
          requestKey: requestKey,
          website: document.getElementById('reqWebsite').value
        })
      });
      var out = await res.json().catch(function () { return {}; });
      if (res.ok) {
        statusEl.className = 'reqnote good';
        statusEl.textContent = 'Request sent — we’ll be in touch.';
        document.getElementById('reqNote').value = '';
        requestKey = mintRequestKey(); // next request is a NEW request
      } else {
        statusEl.className = 'reqnote bad';
        statusEl.textContent = out.error || 'Could not send that. Please try again.';
      }
    } catch (e) {
      statusEl.className = 'reqnote bad';
      statusEl.textContent = 'Could not send that. Please check your connection.';
    }
    btn.disabled = false;
  }

  function render(data) {
    var appointments = data.appointments || [];
    var changes = data.changeOrders || [];
    var photos = data.photos || [];
    var estimates = (data.estimates || []).map(estimateCard).join('') || '<p class="muted">No estimates yet.</p>';
    var invoices = (data.invoices || []).map(invoiceCard).join('') || '<p class="muted">No invoices yet.</p>';

    var html =
      '<h1>' + esc(data.businessName || 'Your account') + '</h1>' +
      '<p class="muted">' + esc(data.customerName || '') + '</p>';
    if (appointments.length) html += '<h2>Upcoming appointments</h2>' + appointments.map(appointmentCard).join('');
    html += '<h2>Estimates</h2>' + estimates;
    if (changes.length) html += '<h2>Changes</h2>' + changes.map(changeCard).join('');
    html += '<h2>Invoices</h2>' + invoices;
    if (photos.length) html += '<h2>Photos</h2>' + photosSection(photos);
    html += requestSection(appointments);
    content.innerHTML = html;
    document.getElementById('reqSend').addEventListener('click', sendRequest);
  }
</script>
</body>
</html>
