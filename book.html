<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book — TradeReady</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           font-size: 16px; line-height: 1.6; color: #1a1a1a; background: #f9f9f9; padding: 2rem 1rem; }
    .page { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px;
            padding: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .brand { font-size: 1.4rem; font-weight: 800; color: #2563eb; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: .25rem; }
    .muted { color: #6b7280; font-size: .9rem; margin-bottom: 1rem; }
    label { font-size: .9rem; font-weight: 600; display: block; margin: 1rem 0 .35rem; }
    input, textarea { width: 100%; padding: .7rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
    textarea { min-height: 110px; resize: vertical; }
    button { width: 100%; margin-top: 1.5rem; padding: .85rem; border: none; border-radius: 8px;
             font-size: 1rem; font-weight: 600; cursor: pointer; background: #2563eb; color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
    .banner { padding: 1rem; border-radius: 8px; text-align: center; font-weight: 600; }
    .ok { background: #ecfdf5; color: #065f46; }
    .err { background: #fef2f2; color: #991b1b; }
    .field-err { color: #b91c1c; font-size: .9rem; margin-top: .75rem; display: none; }
    /* Honeypot: hidden from humans, present for bots. Not display:none —
       some bots skip invisible fields; off-screen is the sweet spot. */
    .hp { position: absolute; left: -9999px; top: -9999px; }
    .footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; font-size: .8rem; color: #9ca3af; }
    /* Slot picker */
    .tz { color: #6b7280; font-size: .8rem; margin-bottom: .75rem; }
    .pills { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .5rem; margin-bottom: .75rem; }
    .pill { flex: 0 0 auto; border: 1px solid #d1d5db; background: #fff; color: #1a1a1a;
            border-radius: 999px; padding: .45rem .9rem; font-size: .9rem; font-weight: 600;
            cursor: pointer; margin: 0; width: auto; }
    .pill.sel { background: #2563eb; border-color: #2563eb; color: #fff; }
    .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: .5rem; }
    .slot { border: 1px solid #d1d5db; background: #fff; color: #1a1a1a; border-radius: 8px;
            padding: .55rem .25rem; font-size: .95rem; font-weight: 600; cursor: pointer; margin: 0; width: auto; }
    .slot.sel { background: #2563eb; border-color: #2563eb; color: #fff; }
    .swap { display: inline-block; margin-top: 1rem; font-size: .85rem; color: #2563eb;
            background: none; border: none; padding: 0; width: auto; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
<div class="page">
  <div class="brand">TradeReady</div>
  <div id="content"><p class="muted">Loading…</p></div>
  <div class="footer">Your details go only to this business so they can follow up on your request.</div>
</div>

<script>
  var API = 'https://tradeready-backend.tradeready.workers.dev/api/booking';
  var params = new URLSearchParams(location.search);
  var token = params.get('b');
  var content = document.getElementById('content');

  var bizName = 'this business';
  var slotState = { timeZone: '', byDate: {}, dates: [], selDate: '', selStart: '' };

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function banner(cls, msg) { content.innerHTML = '<div class="banner ' + cls + '">' + esc(msg) + '</div>'; }

  // Frame-free labels for owner-naive values: the date renders through UTC
  // getters so the VIEWER'S timezone can never shift the business's day.
  function dateLabel(dateStr) {
    var p = dateStr.split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    return d.toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });
  }
  function fmt12(hhmm) {
    var h = +hhmm.slice(0, 2), m = hhmm.slice(3);
    var ap = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + m + ' ' + ap;
  }

  if (!token) { banner('err', 'This link is missing information. Please ask for a new link.'); }
  else { load(); }

  async function load() {
    try {
      var res = await fetch(API + '/config?b=' + encodeURIComponent(token));
      if (!res.ok) { banner('err', 'This link is invalid.'); return; }
      var cfg = await res.json();
      bizName = cfg.businessName || 'this business';
    } catch (e) { banner('err', 'Could not load this page. Please check your connection.'); return; }

    // Slot booking is an opt-in upgrade: when the slots endpoint declines
    // (feature off, or anything else), the page IS the classic request form.
    var slotsOk = false;
    try { slotsOk = await fetchSlots(); } catch (e) { slotsOk = false; }
    if (slotsOk && slotState.dates.length > 0) renderSlotMode();
    else renderRequestMode();
  }

  async function fetchSlots() {
    var res = await fetch(API + '/slots?b=' + encodeURIComponent(token));
    if (!res.ok) return false;
    var out = await res.json();
    slotState.timeZone = out.timeZone || '';
    slotState.byDate = {};
    slotState.dates = [];
    (out.slots || []).forEach(function (s) {
      if (!slotState.byDate[s.date]) { slotState.byDate[s.date] = []; slotState.dates.push(s.date); }
      slotState.byDate[s.date].push(s);
    });
    if (slotState.dates.indexOf(slotState.selDate) === -1) slotState.selDate = slotState.dates[0] || '';
    slotState.selStart = '';
    return true;
  }

  // ── Shared contact form (both modes; re-rendered only on mode switch so
  //    slot refreshes never wipe what the customer typed) ──────────────────
  function formHtml(mode) {
    var timing = mode === 'request'
      ? '<label for="timing">Preferred timing (optional)</label><input id="timing" maxlength="200" placeholder="e.g. weekday mornings, ASAP">'
      : '';
    return '<form id="f">' +
      '<label for="name">Your name</label><input id="name" maxlength="100" autocomplete="name">' +
      '<label for="phone">Phone</label><input id="phone" maxlength="50" autocomplete="tel" inputmode="tel">' +
      '<label for="email">Email</label><input id="email" maxlength="200" autocomplete="email" inputmode="email">' +
      '<label for="address">Job address (optional)</label><input id="address" maxlength="300" autocomplete="street-address">' +
      '<label for="details">What do you need done?</label><textarea id="details" maxlength="2000"></textarea>' +
      timing +
      '<div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>' +
      '<div id="fieldErr" class="field-err"></div>' +
      '<button id="sendBtn" type="submit">' + (mode === 'request' ? 'Send request' : 'Book this time') + '</button>' +
      '</form>';
  }

  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function showErr(msg) {
    var el = document.getElementById('fieldErr');
    el.textContent = msg;
    el.style.display = 'block';
  }
  function contactPayload() {
    return {
      b: token,
      name: val('name'), phone: val('phone'), email: val('email'),
      address: val('address'), details: val('details'), preferredTiming: val('timing'),
      website: document.getElementById('website') ? document.getElementById('website').value : '',
    };
  }
  function validateContact(p) {
    if (!p.name) { showErr('Please tell us your name.'); return false; }
    if (!p.details) { showErr('Please describe what you need done.'); return false; }
    if (!p.phone && !p.email) { showErr('Please give a phone or email so we can reach you.'); return false; }
    return true;
  }

  // ── Request mode (the original flow, unchanged behavior) ────────────────
  function renderRequestMode() {
    content.innerHTML =
      '<h1>' + esc(bizName) + ' — Request a quote</h1>' +
      '<p class="muted">Tell us what you need and how to reach you.</p>' +
      formHtml('request');
    document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); submitRequest(); });
  }

  async function submitRequest() {
    var payload = contactPayload();
    if (!validateContact(payload)) return;
    var btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      var res = await fetch(API + '/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      var out = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        btn.disabled = false; btn.textContent = 'Send request';
        showErr(out.error || 'Something went wrong. Please try again.');
        return;
      }
      banner('ok', 'Thanks — ' + bizName + ' got your request and will get back to you.');
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Send request';
      showErr('Could not send. Please check your connection and try again.');
    }
  }

  // ── Slot mode ───────────────────────────────────────────────────────────
  function renderSlotMode() {
    content.innerHTML =
      '<h1>' + esc(bizName) + ' — Book a time</h1>' +
      '<p class="muted">Pick an open slot and tell us what you need.</p>' +
      '<div class="tz">Times are local to the business' + (slotState.timeZone ? ' (' + esc(slotState.timeZone) + ')' : '') + '.</div>' +
      '<div id="slotArea"></div>' +
      formHtml('slots') +
      '<button type="button" class="swap" id="swapBtn">Prefer to describe your timing instead? Send a request</button>';
    renderSlotArea();
    document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); submitReserve(); });
    document.getElementById('swapBtn').addEventListener('click', renderRequestMode);
  }

  // Chips re-render alone so a slot_taken refresh keeps the typed form.
  function renderSlotArea() {
    var html = '<div class="pills">';
    slotState.dates.forEach(function (d) {
      html += '<button type="button" class="pill' + (d === slotState.selDate ? ' sel' : '') + '" data-date="' + esc(d) + '">' + esc(dateLabel(d)) + '</button>';
    });
    html += '</div><div class="slots">';
    (slotState.byDate[slotState.selDate] || []).forEach(function (s) {
      html += '<button type="button" class="slot' + (s.start === slotState.selStart ? ' sel' : '') + '" data-start="' + esc(s.start) + '">' + esc(fmt12(s.start)) + '</button>';
    });
    html += '</div>';
    var area = document.getElementById('slotArea');
    area.innerHTML = html;
    area.querySelectorAll('.pill').forEach(function (el) {
      el.addEventListener('click', function () {
        slotState.selDate = el.getAttribute('data-date');
        slotState.selStart = '';
        renderSlotArea();
      });
    });
    area.querySelectorAll('.slot').forEach(function (el) {
      el.addEventListener('click', function () {
        slotState.selStart = el.getAttribute('data-start');
        renderSlotArea();
      });
    });
  }

  async function submitReserve() {
    if (!slotState.selDate || !slotState.selStart) { showErr('Please pick a time slot first.'); return; }
    var payload = contactPayload();
    if (!validateContact(payload)) return;
    payload.slot = { date: slotState.selDate, start: slotState.selStart };

    var chosenLabel = dateLabel(slotState.selDate) + ' at ' + fmt12(slotState.selStart);
    var btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = 'Booking…';
    try {
      var res = await fetch(API + '/reserve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      var out = await res.json().catch(function () { return {}; });
      if (res.status === 409) {
        btn.disabled = false; btn.textContent = 'Book this time';
        showErr('That time was just taken — please pick another.');
        try { await fetchSlots(); renderSlotArea(); } catch (e2) { /* keep the stale list */ }
        return;
      }
      if (!res.ok) {
        btn.disabled = false; btn.textContent = 'Book this time';
        showErr(out.error || 'Something went wrong. Please try again.');
        return;
      }
      var okHtml = '<div class="banner ok">' + esc("You're booked for " + chosenLabel + '. ' + bizName + ' has your details and will see you then.') + '</div>';
      if (out.manageToken) {
        okHtml += '<p class="muted" style="margin-top:1rem;text-align:center">' +
          '<a href="booking.html?m=' + encodeURIComponent(out.manageToken) + '">Manage this booking</a>' +
          ' — confirm it, add it to your calendar, or make changes.</p>';
      }
      content.innerHTML = okHtml;
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Book this time';
      showErr('Could not book. Please check your connection and try again.');
    }
  }
</script>
</body>
</html>
