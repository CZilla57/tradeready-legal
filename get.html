<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get TradeReady</title>
  <meta name="description" content="Download TradeReady, the job management and invoicing app for independent tradespeople.">
  <meta name="robots" content="noindex">
  <meta name="apple-itunes-app" content="app-id=6790681059">
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6790681059">
  <link rel="canonical" href="https://apps.apple.com/app/id6790681059">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.7; color: #1a1a1a;
      background: #f9f9f9; padding: 2rem 1rem;
    }
    .page { max-width: 680px; margin: 0 auto; background: #fff; text-align: center;
            border-radius: 12px; padding: 2.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .brand { font-size: 1.5rem; font-weight: 800; color: #2563eb; letter-spacing: -.5px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 1.5rem 0 .25rem; }
    p { color: #374151; margin-bottom: 1.5rem; }
    a { color: #2563eb; }
    .cta {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: .7rem 1.35rem;
      background: #2563eb; color: #fff; text-decoration: none;
      font-size: .95rem; font-weight: 600; border-radius: 10px;
    }
    .cta:hover { background: #1d4ed8; }
    .cta:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .footer { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb;
              font-size: .875rem; color: #6b7280; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #f2f2f7; }
      .page { background: #2c2c2e; box-shadow: none; }
      h1 { color: #f2f2f7; }
      p { color: #c7c7cc; }
      .brand { color: #5b9bff; }
      a { color: #5b9bff; }
      .cta { background: #2f6fe4; color: #fff; }
      .cta:hover { background: #2560cf; }
      .footer { border-top-color: #3a3a3c; color: #8e8e93; }
    }
  </style>
  <script>
    window.location.replace("https://apps.apple.com/app/id6790681059");
  </script>
</head>
<body>
<div class="page">
  <div class="brand">TradeReady</div>
  <h1>Taking you to the App Store</h1>
  <p>If nothing happens after a moment, use the button below.</p>

  <a class="cta" href="https://apps.apple.com/app/id6790681059">Download on the App Store</a>

  <div class="footer">
    © 2026 Chad Rector. TradeReady is not affiliated with Apple Inc.
  </div>
</div>
</body>
</html>
