<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Page not found — TradeReady</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    @font-face { font-family: 'Chakra Petch'; src: url('/fonts/ChakraPetch-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Public Sans'; src: url('/fonts/PublicSans-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('/fonts/IBMPlexMono-Medium.ttf') format('truetype'); font-weight: 500; font-display: swap; }
    :root {
      --bg: #f5f5f1; --ink: #14213d; --muted: #8b93a3; --accent: #1d5c9e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #101826; --ink: #f2f4f8; --muted: #6e7789; --accent: #5b9bdb; }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 17px; line-height: 1.65; color: var(--ink); background: var(--bg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem;
    }
    main { max-width: 460px; text-align: center; }
    .code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 500; font-size: .78rem; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
    h1 { font-family: 'Chakra Petch', 'Segoe UI', sans-serif; font-weight: 700; font-size: 2rem; margin: .5rem 0 .75rem; }
    p { color: var(--muted); margin-bottom: 1.5rem; }
    a { color: var(--accent); font-weight: 600; }
    .links { display: flex; gap: 1.5rem; justify-content: center; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  </style>
</head>

  <div class="links">
    <a href="/">Home</a>
    <a href="/guides/">Guides</a>
    <a href="/support.html">Support</a>
  </div>
</main>
</body>
</html>
